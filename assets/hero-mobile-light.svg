<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc">
<title id="title">Jasil Meledath — Full-stack + cloud engineer</title>
<desc id="desc">From the first interface to the last mile of infrastructure. Building web products, APIs and cloud systems in Bangalore, India. Decorative architecture lines animate gently; reduced-motion preferences are respected.</desc>
<defs>
 <radialGradient id="glow"><stop stop-color="#d3f1e8"/><stop offset="1" stop-color="#f4f7fb"/></radialGradient>
 <linearGradient id="edge"><stop stop-color="#087e72"/><stop offset="1" stop-color="#7055c6"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#cfdbec" stroke-width=".6"/></pattern>
 <clipPath id="clip"><rect width="600" height="460" rx="24"/></clipPath>
</defs>
<style>
 .flow {stroke-dasharray:5 12; animation:flow 9s linear infinite}
 .float {animation:float 7s ease-in-out infinite}
 .signal {animation:signal 5s ease-in-out infinite}
 @keyframes flow {to {stroke-dashoffset:-102}}
 @keyframes float {0%,100% {transform:translateY(0)} 50% {transform:translateY(-7px)}}
 @keyframes signal {0%,100% {opacity:.45} 50% {opacity:1}}
 @media (prefers-reduced-motion:reduce) {.flow,.float,.signal {animation:none}}
</style>
<g clip-path="url(#clip)">
 <rect width="600" height="460" fill="#f4f7fb"/>
 <ellipse cx="550" cy="130" rx="450" ry="350" fill="url(#glow)"/>
 <rect x="360" width="500" height="460" fill="url(#grid)" opacity=".55"/>
 <rect width="600" height="3" fill="url(#edge)"/>
<g font-family="Arial,Helvetica,sans-serif">

 <text x="32" y="51" font-size="15" font-weight="700" letter-spacing="1.6" fill="#087e72">FULL-STACK + CLOUD ENGINEER</text>
 <text x="29" y="139" font-size="62" font-weight="700" letter-spacing="-3" fill="#18263b">Jasil Meledath.</text>
 <text x="32" y="201" font-size="29" fill="#18263b">From the first interface</text>
 <text x="32" y="240" font-size="29" fill="#18263b">to the last mile of infrastructure.</text>
 <text x="32" y="290" font-size="18" fill="#52647b">Web products. APIs. Cloud systems.</text>
 <path d="M32 329H568" stroke="#cfdbec"/>
 <text x="32" y="371" font-size="18" fill="#52647b">Bangalore, India</text>
 <text x="32" y="411" font-size="15" font-weight="700" letter-spacing="2" fill="#087e72">BUILD → SHIP → OPERATE</text>
 <path class="flow" d="M367 370H565" stroke="#087e72" fill="none"/>
 <circle class="signal" cx="565" cy="370" r="5" fill="#087e72"/>
</g></g><rect x=".5" y=".5" width="599" height="459" rx="24" fill="none" stroke="#cfdbec"/></svg>
